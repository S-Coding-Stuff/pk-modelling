
# Build configuration
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# Package metadata
[project]
name = "pkmodel"
version = "0.1.0"
description = "A Python library for pharmacokinetic compartment modelling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
    "build",
]

# Package discovery
[tool.setuptools.packages.find]
include = ["pkmodel*"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["pkmodel/tests"]
addopts = "-ra"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Coverage configuration
[tool.coverage.run]
source = ["pkmodel"]

[tool.coverage.report]
show_missing = true
